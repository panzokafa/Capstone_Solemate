# Docker Compose untuk infrastruktur pengembangan Solemate.
# Jalankan: docker compose up -d
# Password database dibaca dari file .env (tidak disimpan di file ini).

services:
  db:
    image: postgres:16
    container_name: solemate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Hanya buka ke localhost mesin ini, tidak ke jaringan luar.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - solemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solemate_pgdata:
