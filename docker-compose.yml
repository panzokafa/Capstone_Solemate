# Docker Compose untuk infrastruktur pengembangan Solemate.
# Jalankan: docker compose up -d
# Password database dibaca dari file .env (tidak disimpan di file ini).

services:
  db:
    image: postgres:16
    container_name: solemate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Hanya buka ke localhost mesin ini, tidak ke jaringan luar.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - solemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  waha:
    image: devlikeapro/waha:latest-2026.10.1
    container_name: solemate_waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Engine ringan berbasis WebSocket (tanpa Chromium). Pindahkan ke WEBJS jika bermasalah.
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=${WAHA_DASHBOARD_ENABLED:-true}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_HOOK_URL=http://host.docker.internal:3000/api/wa/webhook
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
    volumes:
      - solemate_waha_data:/app/.sessions

volumes:
  solemate_pgdata:
  solemate_waha_data:
